<style>
:root{--ink:#0a0449;--carbon:#140b5e;--violet:#6b5ee0;--gold:#d9a62c;--paper:#f3ecdc;--quiet:#9b8fd6;--err:#f0a0a0;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html,body{min-height:100%;background:var(--ink);color:var(--paper);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{border-top:2px solid var(--gold)}
.wrap{max-width:980px;margin:0 auto;padding:0 32px}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 0}
.brand{display:flex;align-items:center;gap:10px;font:500 15px var(--serif);color:var(--paper);text-decoration:none}
.brand img{width:28px;height:28px}
header button{font:500 12px var(--sans);letter-spacing:.04em;color:var(--quiet);background:none;border:0;cursor:pointer}
header button:hover{color:var(--paper)}
h1{font:500 clamp(36px,4.6vw,56px)/1.06 var(--serif);letter-spacing:-.01em}
h1 em{color:var(--gold);font-style:normal}
.lede{color:var(--quiet);font-size:15px;margin-top:10px}
.icon{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#gate{min-height:calc(100vh - 90px);display:grid;place-items:center;text-align:center}
#gate form{display:flex;flex-direction:column;align-items:center;gap:24px}
#gate img.mark{width:64px;height:64px}
.pins{display:flex;gap:12px;width:100%;max-width:420px}
.pins input{flex:1;min-width:0;height:64px;padding:0 18px;text-align:center;font:500 20px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--paper);background:var(--carbon);
  border:1px solid rgb(107 94 224/.3);border-radius:10px;outline:none;transition:border-color .15s}
.pins input:focus{border-color:var(--gold)}
#err{min-height:20px;font:500 12px var(--sans);letter-spacing:.02em;color:var(--err)}

/* GOAL INDICATORS (2026-10-18, was "the shelf"): who he is on top, the three managers below */
#shelf{padding:36px 0 90px}
#shelf .top{margin-bottom:40px}
.eb{font:500 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--quiet);margin:0 0 14px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:44px}
.chip{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:12px;background:var(--carbon);
  border:1px solid rgb(107 94 224/.22);color:var(--paper);text-decoration:none;transition:border-color .15s,transform .15s}
.chip:hover,.card:hover{border-color:rgb(222 224 232/.55);transform:translateY(-1px)}
.chip .ic{flex:none;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:rgb(217 166 44/.14);color:var(--gold)}
.chip.linkedin .ic{background:rgb(10 102 194/.18);color:#5aa6ef}
.chip .t{font:500 19px/1.15 var(--serif)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:14px;min-height:210px;padding:26px;border-radius:14px;
  background:var(--carbon);border:1px solid rgb(107 94 224/.25);color:var(--paper);text-decoration:none;
  transition:border-color .15s,transform .15s}
.card .ic{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;background:rgb(217 166 44/.14);color:var(--gold)}
.card.business .ic{background:rgb(76 201 240/.12);color:#4cc9f0}
.card .t{font:500 30px/1.05 var(--serif)}
.card .f{font:400 14px var(--sans);color:var(--quiet);margin-top:6px}
.card .go{margin-top:auto;display:flex;gap:8px}
.card .go span,.card .go a{font:500 11px var(--sans);letter-spacing:.1em;padding:7px 12px;border-radius:999px;color:var(--gold);
  border:1px solid rgb(217 166 44/.35);text-decoration:none}
.card .go a:hover{border-color:rgb(222 224 232/.55)}
.card.soon{opacity:.45;pointer-events:none}
.card.soon .go span{color:var(--quiet);border-color:rgb(155 143 214/.35)}
@media(max-width:860px){.row,.grid{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:0 20px}.pins input{height:58px;font-size:17px}}

/* PHONE LAW (2026-10-18, his word): Goal Indicators reads like a phone, on any screen -- one 430px column */
.wrap{max-width:430px;padding:0 20px}
.row,.grid{grid-template-columns:1fr}
.pins input{height:58px;font-size:17px}
</style>
</head>

   <div>
    <h1>_Y_<em>VAULT</em></h1>
    <p class="lede">Goal indicators. Enter the code.</p>
   </div>
   <div class="pins">
    <input id="code" type="password" name="password" autocomplete="current-password" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="passphrase" aria-label="Vault passphrase">
   </div>
   <div id="err"></div>
  </form>
 </section>

 <section id="shelf" hidden>
  <div class="top">
   <h1>Goal <em>indicators</em>.</h1>
   <p class="lede">Who we are, then where it moves.</p>
  </div>
  <div class="row" id="row"></div>
  <p class="eb" id="mgr-eb" hidden>Managers · local</p>
  <div class="grid" id="grid"></div>
 </section>
</div>

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
 <symbol id="ic-resume" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="9" r="2.2"/><path d="M8.3 16c.6-2 2-3 3.7-3s3.1 1 3.7 3"/></symbol>
 <symbol id="ic-link" viewBox="0 0 24 24"><rect x="2" y="9" width="10" height="6" rx="3" transform="rotate(-45 7 12)"/><rect x="12" y="9" width="10" height="6" rx="3" transform="rotate(-45 17 12)"/></symbol>
 <symbol id="ic-doc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
 <symbol id="ic-page" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
 <symbol id="ic-mkt" viewBox="0 0 24 24"><path d="M4 10v4h3l6 4V6L7 10H4z"/><path d="M17 9.5a3.5 3.5 0 0 1 0 5"/></symbol>
 <symbol id="ic-biz" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 13h18"/></symbol>
 <symbol id="ic-users" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5"/><circle cx="17" cy="10" r="2.2"/><path d="M16 14.6c2 .2 3.6 1.6 4.3 4.4"/></symbol>
</svg>

<script>
const $=s=>document.querySelector(s), code=document.querySelector("#code");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICONS={linkedin:"ic-link",resume:"ic-resume",page:"ic-doc",marketing:"ic-mkt",business:"ic-biz",users:"ic-users"};
const ic=k=>`<span class="ic"><svg class="icon"><use href="#${ICONS[k]||"ic-page"}"/></svg></span>`;
async function load(){
  const r=await fetch("api/list",{credentials:"same-origin"});
  if(r.status!==200){$("#gate").hidden=false;$("#shelf").hidden=true;$("#out").hidden=true;code.focus();return}
  const d=await r.json();
  // top: the guides + who he is, each opens in its own tab
  $("#row").innerHTML=d.pages.filter(p=>p.group==="top").map(p=>
    `<a class="chip ${p.kind}" href="${encodeURIComponent(p.file)}${p.kind==="resume"?"/":""}" target="_blank" rel="noopener">${ic(p.kind)}<span class="t">${esc(p.title)}</span></a>`).join("");
  // managers: the local apps, opened in place (absent on the hosted vault)
  const m=d.pages.filter(p=>p.group==="manager");
  $("#mgr-eb").hidden=!m.length;
  $("#grid").innerHTML=m.map(p=>{
    if(p.soon) return `<div class="card soon ${p.kind}">${ic(p.kind)}<span><span class="t">${esc(p.title)}</span><br><span class="f">${esc(p.line)}</span></span><span class="go"><span>PROPOSAL · LATER</span></span></div>`;
    const also=p.also?`<a href="${encodeURIComponent(p.also.file)}/">${esc(p.also.title)} →</a>`:"";
    return `<div class="card ${p.kind}" data-href="${encodeURIComponent(p.file)}/" role="link" tabindex="0">${ic(p.kind)}<span><span class="t">${esc(p.title)}</span><br><span class="f">${esc(p.line)}</span></span><span class="go"><a href="${encodeURIComponent(p.file)}/">OPEN →</a>${also}</span></div>`;
  }).join("");
  $("#gate").hidden=true;$("#shelf").hidden=false;$("#out").hidden=false;
}
async function send(){
  const pin=code.value;
  const r=await fetch("api/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin})});
  if(r.ok)return load();
  const d=await r.json().catch(()=>({}));$("#err").textContent=d.error||"Wrong code.";
  code.value="";code.focus();
}
code.addEventListener("input",()=>{$("#err").textContent=""});
$("#f").addEventListener("submit",e=>{e.preventDefault();send()});
$("#grid").addEventListener("click",e=>{const c=e.target.closest(".card[data-href]");if(c&&!e.target.closest("a"))location.href=c.dataset.href});
$("#grid").addEventListener("keydown",e=>{const c=e.target.closest(".card[data-href]");if(c&&e.key==="Enter")location.href=c.dataset.href});
$("#out").addEventListener("click",async()=>{await fetch("api/logout",{method:"POST",credentials:"same-origin"});load()});
load();
</script>
