<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SUBJECT}}</title>
<style>@media only screen and (max-width:600px){.container{width:100% !important;border-radius:0 !important}
.px{padding-left:24px !important;padding-right:24px !important}}</style>
</head>
<body style="margin:0;padding:0;background-color:#ece6d6;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">{{PREHEADER}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:#ece6d6;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0"
             style="width:600px;max-width:600px;background-color:#faf6ea;
             border-radius:16px;overflow:hidden;border:1px solid rgba(14,14,16,.08);">
        <tr><td>
          <img src="{{PUBLIC_URL}}/03_img/11_mail_banner.jpg" width="600" alt="Custom AI Models"
               style="display:block;width:100%;max-width:600px;height:auto;border:0;">
        </td></tr>
        <tr><td class="px" style="padding:32px 40px 0 40px;">
          <span style="font-family:'Courier New', monospace;font-size:11px;letter-spacing:1.2px;color:#d23c9b;text-transform:uppercase;">SCOPING</span>
        </td></tr>
        <tr><td class="px" style="padding:12px 40px 0 40px;">
          <h1 style="margin:0;font-family:Georgia, 'Times New Roman', serif;font-size:27px;line-height:1.32;
              color:#0e0e10;font-weight:500;letter-spacing:-.2px;">{{HEADLINE}}</h1>
        </td></tr>
        <tr><td class="px" style="padding:20px 40px 8px 40px;">
          <p data-slot="body" style="margin:0 0 16px 0;font-family:Arial, Helvetica, sans-serif;font-size:15px;line-height:1.6;color:#0e0e10;">{{BODY}}</p>
        </td></tr>
        
          <tr><td class="px" style="padding:0 40px 20px 40px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"><tr>
              <td width="3" style="background:#4fc3d9;border-radius:2px;font-size:0;line-height:0;">&nbsp;</td>
              <td style="padding:0 0 0 14px;">
                <p style="margin:0;font-family:Arial, Helvetica, sans-serif;font-size:15.5px;font-weight:bold;
                   color:#0e0e10;">{{ITEM_TITLE}}</p>
                <p style="margin:4px 0 0 0;font-family:Arial, Helvetica, sans-serif;font-size:14px;line-height:1.5;
                   color:#0e0e10;">{{ITEM_TEXT}}</p>
              </td>
            </tr></table>
          </td></tr>
        <tr><td class="px" style="padding:8px 40px 0 40px;">
          <p style="margin:0;font-family:Arial, Helvetica, sans-serif;font-size:14px;color:#0e0e10;">
            {{SENDER}}
          </p>
        </td></tr>
        <tr><td class="px" style="padding:8px 40px 36px 40px;">
          <p style="margin:0;font-family:'Courier New', monospace;font-size:11px;line-height:1.6;
              color:#595959;">
            {{FOOTER}}
          </p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
